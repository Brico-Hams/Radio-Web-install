    <section id="inicio" class="panel help-section" data-help><h2>1. Quick start</h2>
      <h3>Install the local version</h3>
      <p>Download the file for your system and <code>SHA256SUMS</code> from <a href="https://github.com/Brico-Hams/Radio-Web-install/releases/latest" target="_blank" rel="noopener noreferrer">the latest release</a>. Do not select the automatically generated “Source code” archives unless you want to install from source. Verify the SHA-256 before running the installer.</p>
      <ul>
        <li><strong>Windows 11 x64:</strong> extract the entire ZIP <code>*-windows-x64.zip</code>, open PowerShell in the extracted folder, and run <code>powershell -NoProfile -ExecutionPolicy Bypass -File .\Install.ps1</code>. No administrator privileges or separate Node installation are required. Launch <strong>Bricohams Radio Workspace</strong> from the Start menu.</li>
        <li><strong>Debian, Ubuntu, and Raspberry Pi OS:</strong> check <code>dpkg --print-architecture</code>, download only the matching <code>.deb</code> (amd64, arm64, or armhf), and run <code>sudo apt install ./nombre-del-paquete.deb</code>. Node is included. Launch the app from the menu or with <code>bricohams-radio</code>. 32-bit ARM requires ARMv7 or later.</li>
        <li><strong>Arch Linux:</strong> extract <code>*-arch.tar.gz</code>, install <code>base-devel</code> and <code>nodejs</code> with pacman, review the <code>PKGBUILD</code> and run <code>makepkg -si</code> as a regular user. Then launch <code>bricohams-radio</code>.</li>
        <li><strong>FreeBSD 14 amd64:</strong> extract <code>*-freebsd-amd64.tar.gz</code>, enter that folder, and run <code>su -c './install.sh'</code>. Install Node 22 with <code>pkg</code> if needed. Run <code>bricohams-radio</code> as a regular user. WebUSB/Web Serial access depends on Chromium support and is not guaranteed.</li>
      </ul>
      <p>The launchers open <code>http://127.0.0.1:8787</code> and leave the server running in the background, without automatically starting it at login. Closing the tab does not stop the server. Always use the same browser, profile, and address to retain your backups. USB drivers are configured separately: see <a href="#drivers">Drivers</a>.</p>
      <p>The complete guide covers SHA-256 verification, updates, shutdown, and uninstallation in <a href="https://github.com/Brico-Hams/Radio-Web-install/blob/main/docs/DEPLOYMENT.md#instaladores-locales" target="_blank" rel="noopener noreferrer">Local installation and deployment</a>.</p>
      <h3>Alternative: run from source</h3>
      <ol class="guide-steps">
        <li>Install <a href="https://nodejs.org/" target="_blank" rel="noopener noreferrer">Node.js 22 or later</a>.</li>
        <li>In the project folder, run <code>npm ci --ignore-scripts</code> and then <code>npm start</code>.</li>
        <li>Open <code>http://127.0.0.1:8787</code> in <strong>desktop Chrome, Edge, or Brave</strong>. If you enter <code>localhost</code>, the server redirects you to that address to avoid separate backup storage; other IP addresses are rejected for security.</li>
        <li>Choose your family (OpenGD77 or Quansheng) and exact model, check the confirmation box or enable <strong>PRO mode</strong> for this session, and click <strong>Connect and back up</strong>. PRO avoids repeated confirmations; it does not remove browser permissions, backups, or CRC checks. The entire project is in <strong>Beta / validation</strong>.</li>
        <li>Wait for the automatic backup to finish and export the <code>.rwb.json</code>. No writes are enabled without a verified backup.</li>
      </ol>
      <p class="card-note">Firefox and Safari do not provide WebUSB/Web Serial. Private windows may delete backups when closed.</p>
    </section>

    <section id="funcionamiento" class="panel help-section" data-help><h2>2. How it works</h2>
      <p><strong>Two modes.</strong> The top badge shows “Web · GitHub Pages” (a static site, no server) or “Local · installed” (a Node server on your computer). In both modes, the radio, backups, and edits stay in your browser. Differences in web mode:</p>
      <ul class="feature-list">
        <li><strong>Firmware</strong>: download the file from the official source (the button takes you there) and load it using <em>Load the downloaded file</em>. F4HWN is verified by size and published SHA-256; OpenGD77 is checked by name and ZIP format, and its SHA-256 is calculated only locally because the publisher does not publish a hash.</li>
        <li><strong>RadioID contacts</strong>: download <code>user.csv</code> from radioid.net and load it into the app (max. 100 MiB). It is filtered by the selected country and area, and at most 5,000 contacts are displayed; narrow the area if there are more. Files not from RadioID are rejected.</li>
        <li><strong>Optional profile</strong>: callsign and 7-digit DMR ID, stored only in this browser; your entry is marked “(you).” You can delete it at any time.</li>
        <li><strong>RepeaterBook</strong>: unavailable in web mode; requires the local version and an approved token configured in the server environment.</li>
        <li><strong>Satellites</strong>: come from a daily list generated from SatNOGS (ISS 25544, SO-50 27607, AO-91 43017, PO-101 43678). A warning appears if it is more than 7 days old. Data: SatNOGS DB / Libre Space Foundation, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.</li>
      </ul>
      <p>The app has two parts that run on your computer (local mode):</p>
      <ul class="feature-list">
        <li><strong>Browser</strong>: communicates with the radio over USB (WebUSB) or a serial port (Web Serial), stores backups in IndexedDB, and edits files locally.</li>
        <li><strong>Local Node server</strong> (only <code>127.0.0.1</code>): serves the website and acts as a controlled intermediary to official sources (firmware, RadioID, RepeaterBook, SatNOGS, CelesTrak). It never receives your backups, calibration, or codeplugs.</li>
      </ul>
      <p>Protection workflow: <strong>connect &rarr; identify &rarr; automatic backup &rarr; SHA-256 verification &rarr; write permission tied to that connection</strong>. Before every destructive operation, the backup is read and checked again. Disconnecting, changing radios, or deleting the backup revokes permission.</p>
    </section>

    <section id="opengd77" class="panel help-section" data-help><h2>3. OpenGD77</h2>
      <ul class="feature-list">
        <li><strong>MK22</strong> (GD-77, DM-1801, RD-5R) and <strong>STM32</strong> (MD-UV380, MD-9600, MD-2017, DM-1701): WebUSB. On Windows they require WinUSB (see <a href="#drivers">drivers</a>).</li>
        <li><strong>DM-32 / UV008</strong>: Web Serial at 115200 baud, no additional driver on Windows 10/11.</li>
        <li>Reads identification, calibration, and standard 128 KiB codeplugs. Edit channels, add channels from templates, RadioID contacts, and the SAT list (max. 25).</li>
        <li><strong>Writing to the radio is blocked</strong> because there is no verified method to back up the microcontroller’s entire firmware. Save the binary and write it with the official CPS if you choose to do so.</li>
      </ul>
    </section>

    <section id="quansheng" class="panel help-section" data-help><h2>4. Quansheng UV-K1 / UV-K5 V3 with F4HWN</h2>
      <ul class="feature-list">
        <li>Only PY32F071 with F4HWN v6 or later and Multiboot. Not suitable for older UV-K5 models or factory firmware.</li>
        <li>Web Serial at 38400 baud through a USB-C data cable or USB-to-serial programming cable.</li>
        <li>Automatic backup: calibration, the full 2 MiB external Flash (requires <strong>Labs v6.1+</strong> with hardware CRC), and the <code>Main</code>image. The 2 MiB backup may take 10–20 minutes.</li>
        <li>With a verified backup: install/erase slots 1–4 and reset CFG banks 1–4. <code>Main</code> is never a target.</li>
        <li>Switch slots on the radio: power on while holding <kbd>M</kbd> (not PTT), choose the slot, and confirm twice.</li>
      </ul>
    </section>

    <section id="codeplug" class="panel help-section" data-help><h2>5. Contacts, repeaters, and satellites</h2>
      <ul class="feature-list">
        <li><strong>RadioID contacts</strong> (OpenGD77 only): search by country and state, browse pages, select, and add to the open codeplug. Duplicates are skipped.</li>
        <li><strong>RepeaterBook repeaters</strong>: requires RepeaterBook to approve this app and issue you an individual <code>rbuapp_</code>token, configured only on the server. Alternative: import an authorized JSON export. All new channels are <strong>RX only</strong>.</li>
        <li><strong>Satellites</strong>: choose a NORAD ID, update the TLE (SatNOGS or CelesTrak), look up FM frequencies, and calculate passes locally using your position (with consent). In OpenGD77 you can load it into the native SAT list; in Quansheng you can add FM memories to the F4HWN v6 configuration or export CHIRP CSV and TLE. Beta writes require a full backup; F4HWN v6.0 remains read-only.</li>
      </ul>
    </section>

    <section id="firmware" class="panel help-section" data-help><h2>6. Official firmware</h2>
      <p>Only stable releases are downloaded from <a href="https://github.com/armel/uv-k1-k5v3-firmware-custom/releases" target="_blank" rel="noopener noreferrer">Armel’s GitHub (F4HWN)</a>, with the publisher’s SHA-256, and from <a href="https://www.opengd77.com/downloads/" target="_blank" rel="noopener noreferrer">opengd77.com</a> (no published hash: calculated locally). Downloading does not install anything or unlock writes. Always check the model and hardware revision.</p>
    </section>

    <section id="copias" class="panel help-section" data-help><h2>7. Backups and recovery</h2>
      <ul class="feature-list">
        <li>Backups live in this browser’s IndexedDB for <code>http://127.0.0.1:8787</code>. Clearing site data deletes them: <strong>always export</strong> the <code>.rwb.json</code>.</li>
        <li>The <code>.rwb.json</code> contains a manifest, Base64-encoded files, and their SHA-256 hashes. Store it privately: it includes personal data and your radio’s unique calibration.</li>
        <li>This app does not restore calibration automatically. For recovery, use each project’s official tools with these files.</li>
      </ul>
    </section>

    <section id="drivers" class="panel help-section" data-help><h2>8. USB drivers (unofficial support)</h2>
      <p class="notice-inline"><strong>Warning:</strong> this section provides community guidance, not manufacturer support. Download drivers only from the linked official websites. Changing a driver may prevent another program from seeing the radio; all changes can be reversed in Device Manager.</p>
      <div class="table-scroll"><table><thead><tr><th>Device / cable</th><th>Windows 10/11</th><th>Linux</th><th>macOS</th></tr></thead><tbody>
        <tr><td>OpenGD77 MK22 / STM32 (USB <code>1FC9:0094</code>)</td><td>WinUSB with <a href="https://zadig.akeo.ie/" target="_blank" rel="noopener noreferrer">Zadig</a></td><td>udev rule (below)</td><td>Not validated</td></tr>
        <tr><td>DM-32 / UV008 (USB serial)</td><td>Built in (usbser)</td><td>Built in (cdc_acm) + group <code>dialout</code></td><td>Built in</td></tr>
        <tr><td>UV-K1 / UV-K5 V3 over USB-C</td><td>Built in (usbser)</td><td>Built in + <code>dialout</code></td><td>Built in</td></tr>
        <tr><td>Kenwood K1 cable with CH340/CH341</td><td><a href="https://www.wch-ic.com/downloads/CH341SER_EXE.html" target="_blank" rel="noopener noreferrer">WCH CH341SER</a></td><td>Built in (ch341)</td><td>Usually built in; otherwise WCH</td></tr>
        <tr><td>Cable with CP210x</td><td><a href="https://www.silabs.com/developer-tools/usb-to-uart-bridge-vcp-drivers" target="_blank" rel="noopener noreferrer">Silicon Labs VCP</a></td><td>Built in (cp210x)</td><td>Silicon Labs VCP</td></tr>
        <tr><td>Cable with PL2303</td><td><a href="https://www.prolific.com.tw/US/ShowProduct.aspx?p_id=225" target="_blank" rel="noopener noreferrer">Prolific</a> (counterfeit chips do not work)</td><td>Built in (pl2303)</td><td>Prolific</td></tr>
      </tbody></table></div>
      <h3>Windows: WinUSB for OpenGD77 (MK22/STM32)</h3>
      <ol class="guide-steps">
        <li>Turn on the radio running OpenGD77 in normal mode (not bootloader) and connect it.</li>
        <li>Open Zadig, select <em>Options &rarr; List All Devices</em> and choose the device with USB ID <code>1FC9 0094</code>. Check the ID before continuing: selecting another device could disable your keyboard, mouse, or drive.</li>
        <li>Select <strong>WinUSB</strong> and click <em>Replace Driver</em>. Disconnect and reconnect the radio.</li>
        <li><strong>Revert</strong>: Device Manager &rarr; device &rarr; <em>Uninstall device</em> with the delete-driver option checked &rarr; reconnect. Do this if the desktop CPS no longer sees the COM port.</li>
      </ol>
      <h3>Linux: permissions</h3>
      <p>Create <code>/etc/udev/rules.d/70-opengd77.rules</code> with:</p>
      <pre class="help-code">SUBSYSTEM=="usb", ATTRS{idVendor}=="1fc9", ATTRS{idProduct}=="0094", MODE="0660", TAG+="uaccess"</pre>
      <p>Then run <code>sudo udevadm control --reload-rules</code> and reconnect. For serial ports, add your user to <code>dialout</code> (Debian/Ubuntu) or <code>uucp</code> (Arch) and log out. If WebUSB reports it cannot claim the interface, the kernel’s <code>cdc_acm</code> driver is using it; this combination has not been validated by the project.</p>
      <h3>Check the cable</h3>
      <p>Many USB-C cables are charging-only. If no new port appears when connecting, try another data cable and another direct USB port (no hub).</p>
    </section>

        <tr><td><samp>Base de copias bloqueada por otra pestana.</samp></td><td>Another app tab is open.</td><td>Close the other tabs and reload.</td></tr>

        <tr><td><samp>RepeaterBook limito el acceso: espera al menos 15 minutos</samp></td><td>The provider returned HTTP 429 (request limit).</td><td>Wait at least 15 minutes; there are no automatic retries.</td></tr>
        <tr><td><samp>TLE caducado (&gt;7 dias) o con epoca futura</samp></td><td>Outdated orbital elements.</td><td>Update the orbital elements or switch providers.</td></tr>

    <section id="faq" class="panel help-section" data-help><h2>10. Frequently asked questions</h2>
      <details><summary>Why can’t I write the codeplug to my OpenGD77 radio?</summary><p>The app’s policy requires a complete, verified firmware backup before any write, and OpenGD77 does not provide a complete microcontroller dump over this protocol. You can edit and save the binary and write it with the official CPS at your own risk.</p></details>
      <details><summary>Is my data sent to any server?</summary><p>No. Backups, calibration, and codeplugs stay in your browser in both modes. In local mode, queries you initiate (country/area, NORAD, firmware model) go to official providers through the local server. In web mode, the browser only contacts api.github.com directly for the F4HWN catalog (GitHub sees your IP); RadioID data comes from the <code>user.csv</code> you load, and satellites come from the site’s own static file.</p></details>
      <details><summary>Can I use it on a phone or publish it on the Internet?</summary><p>The local server listens only on <code>127.0.0.1</code>; do not expose it on a network. To use it without installing anything, use web mode on GitHub Pages (see <a href="#funcionamiento">How it works</a>). Android Chrome does not generally provide Web Serial.</p></details>
      <details><summary>Does it work with GitHub Pages?</summary><p>Yes, in web mode: radio access, backups, and editing work the same way; firmware and RadioID’s <code>user.csv</code> are loaded manually, satellites come from a daily list, and RepeaterBook is unavailable. See <a href="#funcionamiento">How it works</a>.</p></details>
      <details><summary>How long does a Quansheng backup take?</summary><p>The 2 MiB external Flash takes 10–20 minutes or longer at 38400 baud. Do not disconnect or put the computer to sleep.</p></details>
      <details><summary>Can I install factory firmware or firmware for another radio?</summary><p>No. Only stable F4HWN v6.x images are accepted in slots 1–4. OpenGD77 and factory firmware are not flashed.</p></details>
      <details><summary>Why don’t imported channels transmit?</summary><p>They are created RX-only and without tones to avoid unauthorized transmissions. Check frequencies, tones, Color Code, Time Slot, and your license before enabling TX with the CPS.</p></details>
      <details><summary>How do I load satellites into OpenGD77?</summary><p>Open or read the codeplug, go to SAT / passes, update the TLE, look up frequencies, choose an FM frequency, and click Load satellite into SAT list. Save the binary.</p></details>
      <details><summary>Do I need an amateur radio license?</summary><p>To transmit on amateur radio bands, yes, according to your country’s regulations. Listening and programming do not transmit.</p></details>
      <details><summary>What happens if power fails while writing a slot?</summary><p>The slot may become invalid; Main is not touched. Boot into Main and repeat the installation. No software guarantees recovery from electrical failures.</p></details>
      <details><summary>Is it affiliated with OpenGD77, grid.radio, F4HWN, or Quansheng?</summary><p>No. It is an independent Bricohams project that interoperates with their public formats.</p></details>
    </section>

    <section id="soporte" class="panel help-section" data-help><h2>11. Support</h2>
      <p>Community support, without warranty, on <a href="https://github.com/Brico-Hams/Radio-Web-install/issues" target="_blank" rel="noopener noreferrer">GitHub Issues</a>. Include:</p>
      <ul class="feature-list"><li>Operating system, browser and version, Node version.</li><li>Exact radio model, revision, and firmware.</li><li>Steps to reproduce and the text of the Operations log.</li></ul>
      <p><strong>Never publish</strong> RepeaterBook tokens, <code>.rwb.json</code>files, calibration, codeplugs containing personal data, or your location. For vulnerabilities, follow <code>SECURITY.md</code> and do not open a public issue.</p>
    </section>
