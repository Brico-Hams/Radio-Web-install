  <div id="app"></div>
  <template id="icom-content">
    <section class="hero"><span class="eyebrow accent">ICOM IC-705 / IC-9700 - SIN PROBAR</span>
      <h1>Firmware personalizado Icom para transversores</h1>
      <p>Prepara en tu navegador el firmware de Dawid SQ6EMM para el Icom IC-705 y el IC-9700. Tu archivo oficial se lee en este equipo y no se envia a ningun servidor.</p>
      <p><a href="ayuda-icom.html">Leer la guia del firmware Icom</a> | <a href="ayuda-icom-internals.html">Interior del firmware</a> | <a href="ayuda-icom-parches.html">Analisis de parches</a></p>
    </section>
    <aside class="notice" id="icom-warning"><div><h2>Aviso importante</h2>
      <ul>
        <li>Es firmware no oficial: no es de Icom ni esta respaldado por Icom. Puede dejar la radio inservible y anular la garantia.</li>
        <li>Transmite solo en las frecuencias y con las potencias que tu licencia permita.</li>
        <li>Comprueba el retardo de TX y la potencia de cada posicion de transversor con una carga ficticia antes de conectar un transversor o una antena.</li>
        <li>Solo se aceptan archivos oficiales de Icom sin modificar. Bricohams no ha probado este firmware en una radio.</li>
      </ul></div></aside>
    <section class="panel">
      <h2>1. Archivos admitidos</h2>
      <p>Estas son las versiones oficiales que el parcheador reconoce. El MD5 del resultado debe coincidir con el de la ultima columna.</p>
      <div class="table-wrap"><table><thead><tr><th scope="col">Radio</th><th scope="col">Archivo oficial</th><th scope="col">MD5 de entrada</th><th scope="col">Release</th><th scope="col">MD5 de salida</th></tr></thead><tbody id="icom-files-rows"></tbody></table></div>
      <p id="icom-index-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel">
      <h2>2. Preparar el firmware</h2>
      <label class="icom-drop" id="icom-drop" for="icom-file" tabindex="0" role="button">Arrastra aqui el archivo oficial .dat o pulsa para elegirlo</label>
      <input class="sr-only" id="icom-file" type="file" accept=".dat" tabindex="-1" aria-label="Archivo oficial de Icom (.dat)">
      <p id="icom-file-info" class="icom-md5"></p>
      <p><label><input id="icom-accept" type="checkbox" disabled> He leido el aviso: es firmware no oficial y asumo el riesgo.</label></p>
      <div class="icom-actions">
        <button id="icom-build" class="button primary" type="button" disabled>Preparar el firmware</button>
        <a id="icom-download" class="button secondary" hidden>Descargar el firmware</a>
      </div>
      <progress id="icom-progress" max="100" value="0" aria-label="Progreso de la preparacion" hidden></progress>
      <p id="icom-status" role="status" aria-live="polite">Elige el archivo oficial .dat de tu radio.</p>
    </section>
    <section class="panel">
      <h2>3. Instalar en la radio</h2>
      <ol>
        <li>Copia el archivo descargado a la tarjeta SD siguiendo el procedimiento de actualizacion de firmware del manual de Icom.</li>
        <li>Actualiza la radio con ese procedimiento y no cortes la alimentacion hasta que termine.</li>
        <li>Comprueba la pantalla de arranque y el menu de transversores.</li>
      </ol>
      <p>La radio no se programa por USB ni por Web Serial: la instalacion es siempre la actualizacion normal de Icom por tarjeta SD.</p>
      <h3>Volver atras (bootloader A/B)</h3>
      <ul>
        <li>IC-9700: manten pulsado POWER mientras conectas la alimentacion de DC, unos 5 s.</li>
        <li>IC-705: manten pulsado POWER al encender hasta que el LED parpadee, unos 3 s.</li>
      </ul>
    </section>
    <section class="panel">
      <h2>4. Que incluye</h2>
      <ul>
        <li>8 transversores (TRV1 a TRV8) con la frecuencia RF real en pantalla y por CI-V hasta 122 GHz.</li>
        <li>Por transversor: potencia maxima de TX, retardo de TX y, en el IC-9700, inhibicion de PTT.</li>
        <li>Escala del espectro de 10, 6, 3 o 1 dB por division.</li>
        <li>IC-705: rangos de TX ampliados. Transmite solo donde tu licencia lo permita.</li>
        <li>Bootloader A/B con retroceso al firmware anterior.</li>
      </ul>
    </section>

    </section>
