name: Android build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ftx1-cat-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ftx1-cat-mobile-debug
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/app-debug.apk \
            --title "FTX-1 CAT Mobile ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes "Debug APK for ${GITHUB_REF_NAME}. This is experimental alpha software provided without warranties; use at your own risk. Read README.md and DISCLAIMER.md for requirements and limitations."
