name: Android Beta

on:
  push:
    # Declaring tags would stop branch pushes unless branches is declared too.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check wrapper integrity
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Build APK, lint and run host tests
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Hash debug artifacts
        run: |
          cd android/app/build/outputs/apk
          sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bricohams-android-0.8.0-beta-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/SHA256SUMS
            android/app/build/reports
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bricohams-android-0.8.0-beta-debug
          path: android-artifact
      - name: Attach the debug-signed beta APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir upload
          cp "$(find android-artifact -path '*apk/debug/app-debug.apk')" upload/bricohams-android-0.8.0-beta-debug.apk
          (cd upload && sha256sum -- * > SHA256SUMS-android && cat SHA256SUMS-android)
          for attempt in $(seq 1 40); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            [ "$attempt" -eq 40 ] && { echo "La release $TAG no existe tras 20 minutos."; exit 1; }
            sleep 30
          done
          gh release upload "$TAG" upload/* --clobber -R "$GITHUB_REPOSITORY"
