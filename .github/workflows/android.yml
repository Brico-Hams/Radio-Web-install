name: Android Beta

on:
  push:
    # Declaring tags would stop branch pushes unless branches is declared too.
    branches: ["**"]
    tags: ["v*", "android-v*"]
    paths:
      - "android/**"
      - "fdroid/**"
      - "fastlane/**"
      - "scripts/check-android-store.cjs"
      - "tests/android-store.test.cjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "fdroid/**"
      - "fastlane/**"
      - "scripts/check-android-store.cjs"
      - "tests/android-store.test.cjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check wrapper integrity
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Check Android store metadata and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/android-store.test.cjs
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == android-v* ]]; then
            node scripts/check-android-store.cjs --tag "$REF_NAME"
          else
            node scripts/check-android-store.cjs
          fi
      - name: Build APK, lint and run host tests
        shell: bash
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon 2>&1 | tee android-build.log
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ -f android-build.log ]; then
            message="$(tail -n 80 android-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Android build diagnostics::$message"
          fi
          if [ -d android/app/build/test-results ]; then
            message="$(find android/app/build/test-results -name 'TEST-*.xml' -exec grep -h -A 15 '<failure ' {} + | sed -n '1,60p' || true)"
            if [ -n "$message" ]; then
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::error title=Android test failure details::$message"
            fi
          fi
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-diagnostics
          path: |
            android-build.log
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: warn
      - name: Hash debug artifacts
        run: |
          cd android/app/build/outputs/apk
          sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > SHA256SUMS
      - name: Hash unsigned release candidate
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release-unsigned.apk > SHA256SUMS-release
      - name: Preserve unsigned release candidate separately from debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bricohams-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/SHA256SUMS-release
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bricohams-android-0.9.0-beta-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/SHA256SUMS
            android/app/build/reports
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bricohams-android-0.9.0-beta-debug
          path: android-artifact
      - name: Attach the debug-signed beta APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir upload
          cp "$(find android-artifact -path '*apk/debug/app-debug.apk')" upload/bricohams-android-0.9.0-beta-debug.apk
          cp "$(find android-artifact -path '*apk/androidTest/debug/app-debug-androidTest.apk')" upload/bricohams-android-0.9.0-beta-androidTest.apk
          (cd upload && sha256sum -- * > SHA256SUMS-android && cat SHA256SUMS-android)
          for attempt in $(seq 1 40); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            [ "$attempt" -eq 40 ] && { echo "La release $TAG no existe tras 20 minutos."; exit 1; }
            sleep 30
          done
          gh release upload "$TAG" upload/* --clobber -R "$GITHUB_REPOSITORY"
