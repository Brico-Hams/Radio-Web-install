name: Remote station
on:
  push:
    paths: ["remote-station/**", "station*", "diagnostic*", "server.cjs", "android/**", "branding/**", "scripts/*station*", "scripts/export-project.cjs", "tests/*diagnostic*", "package*.json", ".github/workflows/remote-station.yml"]
  pull_request:
    paths: ["remote-station/**", "station*", "diagnostic*", "server.cjs", "android/**", "branding/**", "scripts/*station*", "scripts/export-project.cjs", "tests/*diagnostic*", "package*.json", ".github/workflows/remote-station.yml"]
permissions:
  contents: read
jobs:
  host-agent:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: remote-station
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/build_help.py --check
      - run: python scripts/build_diagnostic_contract.py --check
      - run: python -m unittest discover -s tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python remote-station/scripts/build_diagnostic_contract.py --check
      - run: node --test tests/diagnostics.test.cjs tests/remote-station.test.cjs tests/ui-i18n.test.cjs tests/export-project.test.cjs
      - run: npm --prefix remote-station/apps/web-console ci
      - run: npm --prefix remote-station/apps/web-console test
      - run: npm --prefix remote-station/apps/web-console run lint
      - run: npm run build:station-branding
      - run: npm run build:station
