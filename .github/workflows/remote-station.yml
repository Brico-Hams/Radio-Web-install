name: Remote station
on:
  push:
    paths: ["data/station-accessories-catalog.json", "remote-station/**", "station*", "diagnostic*", "remote-*.cjs", "remote*.js", "remote*.html", "remote*.css", "remoto*", "rigctld-client.cjs", "data/remote-station-catalog.json", "server.cjs", "app.js", "radio-ui.js", "ui-i18n.js", "ui-translations.js", "android/**", "branding/**", "scripts/*station*", "scripts/export-project.cjs", "tests/*diagnostic*", "tests/remote*.test.cjs", "tests/remoto-ui.test.cjs", "tests/ui-i18n.test.cjs", "package*.json", ".github/workflows/remote-station.yml"]
  pull_request:
    paths: ["data/station-accessories-catalog.json", "remote-station/**", "station*", "diagnostic*", "remote-*.cjs", "remote*.js", "remote*.html", "remote*.css", "remoto*", "rigctld-client.cjs", "data/remote-station-catalog.json", "server.cjs", "app.js", "radio-ui.js", "ui-i18n.js", "ui-translations.js", "android/**", "branding/**", "scripts/*station*", "scripts/export-project.cjs", "tests/*diagnostic*", "tests/remote*.test.cjs", "tests/remoto-ui.test.cjs", "tests/ui-i18n.test.cjs", "package*.json", ".github/workflows/remote-station.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: remote-station
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/build_help.py --check
      - run: python scripts/build_diagnostic_contract.py --check
      - run: python -m unittest discover -s tests
      - run: python scripts/build_agent.py --output dist/agent
      - name: Test packaged agent in isolation
        run: >-
          python -I -c "import pathlib, sys, unittest;
          archive = str(pathlib.Path('dist', 'agent', 'bricoham-station-agent.pyz').resolve());
          sys.path[:0] = [archive, str(pathlib.Path('tests').resolve())];
          import bricoham_station_agent.cat as cat;
          assert str(cat.__file__).startswith(archive);
          unittest.main(module=None, argv=['tests', 'test_serial_cat', 'test_wsjtx'])"
      - name: Upload the standalone agent (pure Python, one zipapp for every OS)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: station-agent-pyz
          path: remote-station/dist/agent/bricoham-station-agent.pyz
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python remote-station/scripts/build_diagnostic_contract.py --check
      - run: node --test tests/diagnostics.test.cjs tests/remote-station.test.cjs tests/remote-agent.test.cjs tests/remote-api.test.cjs tests/remote-tx.test.cjs tests/remote-audio.test.cjs tests/remote-tls.test.cjs tests/remote-relay.test.cjs tests/remote-catalog.test.cjs tests/remote-accessories.test.cjs tests/remoto-ui.test.cjs tests/remote-ui-audio.test.cjs tests/ui-i18n.test.cjs tests/export-project.test.cjs
      - run: npm --prefix remote-station/apps/web-console ci
      - run: npm --prefix remote-station/apps/web-console test
      - run: npm --prefix remote-station/apps/web-console run lint
      - run: npm run build:station-branding
      - run: npm run build:station
      - name: Build the host wheel with the compiled web console
        run: python remote-station/scripts/build_release.py --output remote-station/dist/host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: station-host-wheel
          path: remote-station/dist/host/*.whl
          if-no-files-found: error
  console-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-station/apps/web-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew --no-daemon assembleDebug lintDebug
        working-directory: remote-station/apps/web-console/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: station-client-android-debug
          path: remote-station/apps/web-console/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  console-ios:
    # Compile check only: without a signing team there is no installable IPA.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: remote-station/apps/web-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
