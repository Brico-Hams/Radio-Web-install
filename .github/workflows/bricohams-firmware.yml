name: Bricohams firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match UPSTREAM in scripts/build-bricohams.cjs.
  UPSTREAM_REPO: armel/uv-k1-k5v3-firmware-custom
  UPSTREAM_COMMIT: f556a96e73c3e423a00cf473aeb37f827cac05a5
  ARM_GCC: arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi
  ARM_GCC_SHA256: 95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The documented Beta images (docs/BRICOHAMS-FIRMWARE.md).
          - variant: fusion
            args: --preset Fusion --option ENABLE_VOX=OFF
          - variant: labs
            args: --preset Labs --option ENABLE_VOX=OFF
          - variant: ardf
            args: --preset FieldOps --option ENABLE_FEAT_F4HWN_BEACON=OFF --option ENABLE_VOX=OFF --module ardf
          - variant: satellite
            args: --preset FieldOps --option ENABLE_FEAT_F4HWN_BEACON=OFF --option ENABLE_VOX=OFF --module satellite
          - variant: spectrum
            args: --preset FieldOps --option ENABLE_FEAT_F4HWN_BEACON=OFF --option ENABLE_VOX=OFF --module spectrum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install build tools and the pinned ARM toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
          curl -fsSL -o "$RUNNER_TEMP/$ARM_GCC.tar.xz" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/$ARM_GCC.tar.xz"
          echo "$ARM_GCC_SHA256  $RUNNER_TEMP/$ARM_GCC.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/$ARM_GCC.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ARM_GCC/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.variant }}
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # ARGS is a fixed matrix value, never user input; word splitting is intended.
          node scripts/build-bricohams.cjs --source upstream --output "$RUNNER_TEMP/out" $ARGS
          cd "$RUNNER_TEMP/out/artifacts" && sha256sum --check --quiet SHA256SUMS && ls -l
      - name: Verify release firmware matches the web and installer catalog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const assert = require("node:assert/strict");
          const { createHash } = require("node:crypto");
          const catalog = require("./precompiled/catalog.json");
          const entry = catalog.entries.find(item => item.id === `bricohams-${process.env.VARIANT}`);
          assert(entry, "Missing published firmware entry");
          const directory = path.join(process.env.RUNNER_TEMP, "out/artifacts");
          const info = JSON.parse(fs.readFileSync(path.join(directory, "build-info.json"), "utf8"));
          const bytes = fs.readFileSync(path.join(directory, info.firmware));
          assert.equal(createHash("sha256").update(bytes).digest("hex"), entry.sha256,
            "Release firmware differs from the published catalog");
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bricohams-firmware-${{ matrix.variant }}
          path: ${{ runner.temp }}/out/artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bricohams-firmware-*
          path: firmware
      - name: Package one ZIP per variant
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir upload
          for dir in firmware/bricohams-firmware-*; do
            variant=${dir#firmware/bricohams-firmware-}
            (cd "$dir" && sha256sum --check --quiet SHA256SUMS)
            (cd "$dir" && zip -q -r "$GITHUB_WORKSPACE/upload/bricohams-firmware-$variant-$TAG.zip" .)
            cp "$dir"/bricohams.*.bin upload/
          done
          (cd upload && sha256sum -- * > SHA256SUMS-firmware && cat SHA256SUMS-firmware)
      - name: Attach to the release created by the installer workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 40); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            [ "$attempt" -eq 40 ] && { echo "La release $TAG no existe tras 20 minutos."; exit 1; }
            sleep 30
          done
          gh release upload "$TAG" upload/* --clobber -R "$GITHUB_REPOSITORY"
