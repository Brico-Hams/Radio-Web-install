name: Country templates and monthly satellite forecasts

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-template-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Refresh permitted repeater data and regional satellite forecasts
        run: |
          node scripts/fetch-channel-templates.cjs
          node scripts/fetch-template-passes.cjs
          node --test tests/channel-templates.test.cjs
      - name: Publish only validated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel-templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh country templates and monthly satellite forecasts" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
